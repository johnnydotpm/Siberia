name: SiberiaGB Flutter

on:
  push:
    # A push to one of these only starts a screenshot run, for a commit that
    # is checked on its own branch already.
    branches-ignore:
      - "glass-screens/**"
    paths:
      - "syberia/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "syberia/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      build_android:
        description: Build the Android APK
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build iOS IPA
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: siberiagb-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syberia
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze --fatal-infos
      - run: python3 tool/verify_branding.py

  android:
    name: Android release APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syberia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: sh tool/android_signing.sh setup
      - name: Build Android APK
        run: |
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          flutter build apk --release --dart-define=APP_VERSION="$APP_VERSION" --dart-define=GIT_COMMIT="$GITHUB_SHA"
      - name: Check the APK's signature
        run: sh tool/android_signing.sh verify build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: siberiagb-android
          path: syberia/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS signer-ready IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: quality
    runs-on: macos-26
    defaults:
      run:
        working-directory: syberia
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS application
        run: |
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          flutter build ios --release --no-codesign --dart-define=APP_VERSION="$APP_VERSION" --dart-define=GIT_COMMIT="$GITHUB_SHA"
      - name: Package signer-ready IPA
        run: |
          APP_PATH="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          sh tool/package_ios_ipa.sh \
            "$APP_PATH" \
            build/ios/SiberiaGB-iOS.ipa
      - name: Verify IPA payload
        run: |
          IPA=build/ios/SiberiaGB-iOS.ipa
          test "$(unzip -Z1 "$IPA" | grep -c '^Payload/Runner\.app/Info\.plist$')" -eq 1
          test "$(unzip -Z1 "$IPA" | grep -c '^Payload/Runner\.app/PlugIns/SiberiaWidgetExtension\.appex/Info\.plist$')" -eq 1
          if unzip -Z1 "$IPA" | grep -Ev '^(Payload/|Payload$)'; then
            echo "Unexpected files found outside Payload" >&2
            exit 1
          fi
          if unzip -Z1 "$IPA" | grep -F '/Frameworks/objective_c.framework/'; then
            echo "objective_c.framework is incompatible with supported on-device signers" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: siberiagb-ios
          path: syberia/build/ios/SiberiaGB-iOS.ipa
          if-no-files-found: error
