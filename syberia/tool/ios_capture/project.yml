# A small UIKit app and a UI test that drive iOS 26's own switches and
# segmented controls on the simulator, so the drawn copies on Android can be
# matched to recorded frames. Generated with XcodeGen in CI only.
name: Capture
options:
  bundleIdPrefix: dev.siberiagb.capture
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Capture:
    type: application
    platform: iOS
    sources: [Capture]
    info:
      path: Capture/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siberiagb.capture.app
        TARGETED_DEVICE_FAMILY: "1"
  CaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CaptureUITests]
    info:
      path: CaptureUITests/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
    dependencies:
      - target: Capture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siberiagb.capture.uitests
        TEST_TARGET_NAME: Capture
schemes:
  Capture:
    build:
      targets:
        Capture: all
        CaptureUITests: [test]
    test:
      targets: [CaptureUITests]
